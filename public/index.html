<!-- Index                                                         -->
<!-- Main frontend structure for the link tree.                    -->
<!-- Defines the layout for the profile header and the link list.  -->
<!-- ============================================================== -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Josiah's Link Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Main Container -->
  <main class="container">
    
    <!-- Profile Header Section -->
    <header class="profile">
      <!-- Placeholder image for now, we will style this to be a circle -->
      <img src="https://via.placeholder.com/100" alt="Profile Picture" class="avatar">
      <h1>Josiah Ewumi</h1>
      <p>Mechanical Engineer & Full-Stack Developer</p>
    </header>

    <!-- Links Section -->
    <!-- We leave this empty because our JavaScript will inject the links here later -->
    <section id="links-container" class="links-list">
      <!-- Links will appear here -->
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
